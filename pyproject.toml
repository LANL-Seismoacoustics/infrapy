[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrapy"
version = "4.2.261006"
description = "A tool for processing infrasound and seismic array data."
readme = "README.md"
license = "MIT"
authors = [
    {name = "LANL Seismoacoustics Infrasound (LANL-SA) Team", email = "pblom@lanl.gov"}
]
keywords = ["infrasound", "geophysics", "seismic", "array"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.14"
dependencies = [
    "cartopy",
    "click",
    "darkdetect",
    "matplotlib",
    "numba",
    "numpy",
    "obspy",
    "pandas",
    "pisces",
    "pyproj",
    "pyQT5",
    "pyqtgraph",
    "pyqtdarktheme-fork",
    "pywavelets",
    "scikit-learn",
    "scipy",
    "sphinx",
    "sphinx-rtd-theme",
    "sqlalchemy",
]

[project.urls]
Homepage = "https://github.com/LANL-Seismoacoustics/infrapy"
Documentation = "https://infrapy.readthedocs.io/en/latest/"
Repository = "https://github.com/LANL-Seismoacoustics/infrapy.git"
Issues = "https://github.com/LANL-Seismoacoustics/infrapy/issues"

[project.scripts]
infrapy = "infrapy.cli.__main__:main"
infrapype = "infrapy.pipeline.__main__:pipeline"

[project.gui-scripts]
infraview = "InfraView.__main__:main"

[tool.setuptools]
packages = [
    "infrapy",
    "infrapy.association",
    "infrapy.characterization",
    "infrapy.cli",
    "infrapy.detection",
    "infrapy.location",
    "infrapy.pipeline",
    "infrapy.propagation",
    "infrapy.resources",
    "infrapy.resources.travelTimeTables",
    "infrapy.utils",
    "InfraView",
    "InfraView.resources",
    "InfraView.widgets",
    "InfraView.widgets.settings_widgets",
    "InfraView.resources.graphics",
    "InfraView.resources.styles",
]

[tool.setuptools.package-data]
"infrapy.propagation" = ["compass.png"]
"infrapy.resources" = ["default.config"]
"infrapy.resources.travelTimeTables" = [
    "ak135_1st_arrivals.dat",
    "regional_hf.rcg.json",
    "regional_lf.rcg.json",
    "infGEM.rcg.json",
]
