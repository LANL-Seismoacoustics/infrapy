name: pygs

channels:
  - conda-forge

dependencies:
  - python>=3.14
  - cartopy
  - click
  - gdal
  - matplotlib-base
  - netcdf4
  - numpy
  - numpydoc
  - numba
  - obspy
  - oracledb
  - pandas
  - pip
  - pyproj
  - pyqt
  - pyqtgraph
  - pywavelets
  - pyyaml
  - requests
  - scipy
  - scikit-learn
  - sphinx
  - sphinx_rtd_theme

  - pip:
    - pyqtdarktheme
    - darkdetect
    - pisces>=0.4.5.3
    - git+https://github.com/LANL-Seismoacoustics/infrapy.git#egg=infrapy
    - git+https://github.com/LANL-Seismoacoustics/stochprop.git#egg=stochprop
    - git+https://github.com/LANL-Seismoacoustics/infraga.git#egg=infraga
    

