name: infrapy_env

channels:
  - conda-forge

dependencies:
  - python>=3.14
  - cartopy
  - click
  - matplotlib-base
  - numpy
  - numpydoc
  - numba
  - obspy
  - oracledb
  - pandas
  - pip
  - pyproj
  - pyqt
  - pyqtgraph
  - pywavelets
  - pyyaml
  - scipy
  - scikit-learn
  - sphinx
  - sphinx_rtd_theme

  - pip:
    - pyqtdarktheme
    - darkdetect
    - pisces>=0.4.5.3
    - -e .

